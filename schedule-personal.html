  <button class="tab-btn active" onclick="switchView('calendar')">Calendar</button>
  <button class="tab-btn" onclick="switchView('list')">List</button>
</div>

<!-- Tab 1: Calendar View -->
<div id="calendar-view" class="view-content active">
  <h2 class="list-section-title">Schedule</h2>

  <div class="legend">
    <span class="legend-item"><span class="legend-swatch" style="background:#0a1f44;"></span> Dark Knights</span>
    <span class="legend-item"><span class="legend-swatch" style="background:#ffffff;"></span> Bushtits</span>
  </div>

  <div id="calendar"></div>
</div>

<!-- Tab 2: List View -->
<div id="list-view" class="view-content">
  <h2 class="list-section-title">Upcoming Games</h2>
  <div id="upcoming-games-container">Loading schedule...</div>
</div>

<script>
// --- Configuration & Global Helpers ---

const teamLogos = {
  red: '/assets/images/site/red.png',
  crows: '/assets/images/site/crows.png',
  wild: '/assets/images/site/wild.png',
  dk: '/assets/images/site/dark-knights-logo.png',
  bushtits: '/assets/images/site/bushtits-logo.png',
  honkers: '/assets/images/site/honkers.png',
  hooters: '/assets/images/site/hooters.png',
  flamingos: '/assets/images/site/flamingos.png',
  boobies: '/assets/images/site/boobies.png',
  pigeons: '/assets/images/site/pigeons.png',
  shags: '/assets/images/site/shags.png',
  flying: '/assets/images/site/flying.png',
  default: '/assets/images/default.png'
};

// Per-league configuration: each league has its own feed, its own team's
// "self" keyword/logo, and a map of opponent keyword -> logo.
// TODO: fill in opponentLogos for the Bushtits league once you know the
// other PUHL team names/logos (same pattern as the Knights entries below).
const leagueConfigs = {
  knights: {
    url: 'https://knights-schedule-proxy.xarria.workers.dev',
    selfKeyword: 'knights',
    selfLogo: teamLogos.dk,
    opponentLogos: {
      red: teamLogos.red,
      crows: teamLogos.crows,
      wild: teamLogos.wild
    },
    color: '#0a1f44',
    textColor: '#ffffff'
  },
  bushtits: {
    url: 'https://bushtits-schedule-proxy.xarria.workers.dev',
    selfKeyword: 'bushtits',
    selfLogo: teamLogos.bushtits,
    opponentLogos: {
      honkers: teamLogos.honkers,
      hooters: teamLogos.hooters,
      flamingos: teamLogos.flamingos,
      boobies: teamLogos.boobies,
      pigeons: teamLogos.pigeons,
      shags: teamLogos.shags,
      flying: teamLogos.flying
    },
    color: '#ffffff',
    textColor: '#0a1f44'
  }
};

// Returns opposing team logo & swap state, scoped to a specific league's config
function getMatchupDetails(title, leagueKey) {
  const cfg = leagueConfigs[leagueKey];
  if (!title || !cfg) return { oppLogo: teamLogos.default, shouldSwap: false, selfLogo: teamLogos.default };

  const lowerTitle = title.toLowerCase();

  let oppIndex = -1;
  let oppLogo = null;

  for (const kw in cfg.opponentLogos) {
    const idx = lowerTitle.indexOf(kw);
    if (idx !== -1) {
      oppIndex = idx;
      oppLogo = cfg.opponentLogos[kw];
      break;
    }
  }

  const selfIndex = lowerTitle.indexOf(cfg.selfKeyword);

  // Fallback if one isn't matched
  if (selfIndex === -1 || oppIndex === -1) {
    return { oppLogo: oppLogo || teamLogos.default, shouldSwap: false, selfLogo: cfg.selfLogo };
  }

  // Swap if the "self" team is listed first in the title
  const shouldSwap = selfIndex < oppIndex;

  return {
    oppLogo: oppLogo || teamLogos.default,
    shouldSwap: shouldSwap,
    selfLogo: cfg.selfLogo
  };
}

// Given a FullCalendar Event object, figure out which league it came from
function getLeagueKey(event) {
  return (event.source && event.source.id) ? event.source.id : null;
}

// Colors the ENTIRE day cell (not just the event card) per-league. Runs once
// per event via eventDidMount, using the cell FullCalendar already mounted
// the event into — avoids any date-string/timezone matching bugs, and uses
// setProperty(..., 'important') so it reliably wins over FullCalendar's own
// "today" highlight styling.
function applyDayCellColor(dayCell, leagueKey) {
  if (!dayCell) return;
  const cfg = leagueConfigs[leagueKey];
  if (!cfg) return;

  const existing = dayCell.dataset.leagues ? dayCell.dataset.leagues.split(',') : [];
  if (!existing.includes(leagueKey)) existing.push(leagueKey);
  dayCell.dataset.leagues = existing.join(',');
  dayCell.classList.add('has-game');

  const numberEl = dayCell.querySelector('.fc-daygrid-day-number');

  if (existing.length === 1) {
    dayCell.style.setProperty('background-color', cfg.color, 'important');
    dayCell.style.setProperty('background-image', 'none', 'important');
    if (numberEl) numberEl.style.setProperty('color', cfg.textColor, 'important');
  } else {
    // Both teams play the same day: split the tile between their colors
    const colors = existing.map(function(k) {
      return leagueConfigs[k] ? leagueConfigs[k].color : '#ccc';
    });
    const stripe = 100 / colors.length;
    const parts = colors.map(function(c, i) {
      return c + ' ' + (i * stripe) + '%, ' + c + ' ' + ((i + 1) * stripe) + '%';
    });
    dayCell.style.setProperty('background-color', 'transparent', 'important');
    dayCell.style.setProperty('background-image', 'linear-gradient(90deg, ' + parts.join(', ') + ')', 'important');
    if (numberEl) {
      numberEl.style.setProperty('color', '#ffffff', 'important');
      numberEl.style.textShadow = '0 0 3px rgba(0,0,0,0.7)';
    }
  }
}

document.addEventListener('DOMContentLoaded', function() {
  const calendarEl = document.getElementById('calendar');

  const calendar = new FullCalendar.Calendar(calendarEl, {
    initialView: 'dayGridMonth',
    height: 'auto',
    aspectRatio: 1.35,
    headerToolbar: {
      left: 'title',
      center: '',
      right: 'prev,next today'
    },
    eventSources: Object.keys(leagueConfigs).map(function(key) {
      const cfg = leagueConfigs[key];
      return {
        id: key,
        url: cfg.url,
        format: 'ics',
        color: cfg.color
      };
    }),
    eventContent: function(arg) {
      const eventTitle = arg.event.title;
      const leagueKey = getLeagueKey(arg.event);
      const matchup = getMatchupDetails(eventTitle, leagueKey);

      const timeStr = arg.event.start ? arg.event.start.toLocaleTimeString([], {
        hour: 'numeric',
        minute: '2-digit'
      }) : '';

      // CALENDAR VIEW: the whole day tile gets colored (see colorizeDayCells),
      // so this card just needs the logo + time, with text colored for contrast
      const cfg = leagueConfigs[leagueKey];
      const textColor = cfg ? cfg.textColor : '#000';

      return {
        html: `
          <div class="custom-event-card">
            <div class="logo-circle">
              <img src="${matchup.oppLogo}" alt="${eventTitle}" />
            </div>
            <div class="game-time" style="color:${textColor};">${timeStr}</div>
          </div>
        `
      };
    },
    eventDidMount: function(info) {
      const leagueKey = getLeagueKey(info.event);
      const dayCell = info.el.closest('.fc-daygrid-day');
      applyDayCellColor(dayCell, leagueKey);
    },
    eventsSet: function(events) {
      renderListView(events);
    }
  });

  calendar.render();
});

// Tab Switcher Function
function switchView(viewName) {
  document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
  document.querySelectorAll('.view-content').forEach(view => view.classList.remove('active'));

  if (viewName === 'calendar') {
    document.querySelector('.tab-btn:nth-child(1)').classList.add('active');
    document.getElementById('calendar-view').classList.add('active');
  } else {
    document.querySelector('.tab-btn:nth-child(2)').classList.add('active');
    document.getElementById('list-view').classList.add('active');
  }
}

// Function to render upcoming games list
function renderListView(events) {
  const container = document.getElementById('upcoming-games-container');
  if (!container) return;

  const now = new Date();

  const upcomingEvents = events.filter(e => e.start && new Date(e.start) > now);

  if (upcomingEvents.length === 0) {
    container.innerHTML = '<p>No upcoming games scheduled.</p>';
    return;
  }

  upcomingEvents.sort((a, b) => new Date(a.start) - new Date(b.start));

  const grouped = {};
  upcomingEvents.forEach(e => {
    const startDate = new Date(e.start);
    const dateStr = startDate.toLocaleDateString([], {
      weekday: 'long',
      month: 'long',
      day: 'numeric',
      year: 'numeric'
    });

    if (!grouped[dateStr]) grouped[dateStr] = [];
    grouped[dateStr].push(e);
  });

  let html = '';

  for (const date in grouped) {
    html += `
      <div class="date-group">
        <h3 class="date-header">${date}</h3>
        <table class="schedule-table">
          <thead>
            <tr>
              <th style="width: 50%;">Matchup</th>
              <th style="width: 25%;">Time</th>
              <th style="width: 25%;">Location</th>
            </tr>
          </thead>
          <tbody>
    `;

    grouped[date].forEach(event => {
      const startDate = new Date(event.start);
      const timeStr = startDate.toLocaleTimeString([], {
        hour: 'numeric',
        minute: '2-digit',
        timeZoneName: 'short'
      });

      const location = (event.extendedProps && event.extendedProps.location)
        ? event.extendedProps.location
        : 'TBD';

      const leagueKey = getLeagueKey(event);
      const matchup = getMatchupDetails(event.title, leagueKey);
      const leagueLabel = leagueKey === 'knights' ? 'Dark Knights' : (leagueKey === 'bushtits' ? 'Bushtits' : '');

      // LIST VIEW: plain rows, just logos + title (no per-league background)
      html += `
        <tr>
          <td>
            <div class="matchup-cell ${matchup.shouldSwap ? 'swap-sides' : ''}">
              <img src="${matchup.oppLogo}" alt="Opponent Logo" />
              <span>${event.title || 'Game'}</span>
              <img src="${matchup.selfLogo}" alt="${leagueLabel} Logo" />
            </div>
          </td>
          <td>${timeStr}</td>
          <td>${location}</td>
        </tr>
      `;
    });

    html += `
          </tbody>
        </table>
      </div>
    `;
  }

  container.innerHTML = html;
}
</script>
