---
layout: default
title: Schedule
permalink: /schedule/
---

<!-- 1. FullCalendar & iCal Dependencies -->
<script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.11/index.global.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/ical.js@1.5.0/build/ical.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@fullcalendar/icalendar@6.1.11/index.global.min.js"></script>

<style>
  /* --- Tab Navigation Styling --- */
  .schedule-tabs {
    display: flex;
    gap: 20px;
    border-bottom: 2px solid #e0e0e0;
    margin-bottom: 20px;
  }
  
  .tab-btn {
    background: none;
    border: none;
    padding: 10px 5px;
    font-size: 16px;
    font-weight: 600;
    color: #666;
    cursor: pointer;
    position: relative;
    border-bottom: 3px solid transparent;
    margin-bottom: -2px;
  }

  .tab-btn.active {
    color: #000;
    border-bottom-color: #000;
  }

  /* --- View Containers --- */
  .view-content {
    display: none;
  }
  .view-content.active {
    display: block;
  }

  /* --- List View Styling --- */
  .list-section-title {
    font-size: 28px;
    font-weight: 800;
    margin-top: 10px;
    margin-bottom: 24px;
  }

  .date-group {
    margin-bottom: 30px;
  }
  .date-header {
    font-size: 20px;
    font-weight: 700;
    margin-bottom: 12px;
  }
  .schedule-table {
    width: 100%;
    border-collapse: collapse;
    margin-bottom: 20px;
  }
  .schedule-table th, 
  .schedule-table td {
    padding: 12px 16px;
    text-align: left;
  }
  .schedule-table th {
    font-size: 13px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    color: #555;
    border-bottom: 1px solid #ddd;
  }
  .schedule-table tr {
    background-color: #f9f9f9;
    border-bottom: 1px solid #eee;
  }

  /* Matchup Cell layout for List view */
  .matchup-cell {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  /* Swaps the order of elements (Logo 1, Text, Logo 2) */
  .matchup-cell.swap-sides {
    flex-direction: row-reverse;
    justify-content: flex-end;
  }

  .matchup-cell img {
    width: 28px;
    height: 28px;
    object-fit: contain;
  }
</style>

<!-- Navigation Tabs -->
<div class="schedule-tabs">
  <button class="tab-btn active" onclick="switchView('calendar')">Calendar</button>
  <button class="tab-btn" onclick="switchView('list')">List</button>
</div>

<!-- Tab 1: Calendar View -->
<div id="calendar-view" class="view-content active">
  <h2 class="list-section-title">Schedule</h2>
  <div id="calendar"></div>
</div>

<!-- Tab 2: List View -->
<div id="list-view" class="view-content">
  <h2 class="list-section-title">Upcoming Games</h2>
  <div id="upcoming-games-container">Loading schedule...</div>
</div>

<script>
// --- Configuration & Global Helpers ---

const teamLogos = {
  red: '/assets/images/site/red.png',
  crows: '/assets/images/site/crows.png',
  wild: '/assets/images/site/wild.png',
  dk: '/assets/images/site/dark-knights-logo.png',
  default: '/assets/images/default.png'
};

// Returns opposing team logo & swap state
function getMatchupDetails(title) {
  if (!title) return { oppLogo: teamLogos.default, shouldSwap: false };
  
  const lowerTitle = title.toLowerCase();
  
  const opponentKeywords = ['red', 'crows', 'wild'];
  const dkKeyword = 'knights';

  let oppIndex = -1;
  let oppLogo = null;

  for (const kw of opponentKeywords) {
    const idx = lowerTitle.indexOf(kw);
    if (idx !== -1) {
      oppIndex = idx;
      oppLogo = teamLogos[kw];
      break;
    }
  }

  const dkIndex = lowerTitle.indexOf(dkKeyword);

  // Fallback if one isn't matched
  if (dkIndex === -1 || oppIndex === -1) {
    return { oppLogo: oppLogo || teamLogos.default, shouldSwap: false };
  }

  // Swap if Dark Knights is listed first in title
  const shouldSwap = dkIndex < oppIndex;

  return { 
    oppLogo: oppLogo || teamLogos.default, 
    shouldSwap: shouldSwap 
  };
}

document.addEventListener('DOMContentLoaded', function() {
  const calendarEl = document.getElementById('calendar');

  const calendar = new FullCalendar.Calendar(calendarEl, {
    initialView: 'dayGridMonth',
    height: 'auto',
    aspectRatio: 1.35,
    headerToolbar: {
      left: 'title',
      center: '',
      right: 'prev,next today'
    },
    events: {
      url: 'https://knights-schedule-proxy.xarria.workers.dev',
      format: 'ics'
    },
    eventContent: function(arg) {
      const eventTitle = arg.event.title;
      const matchup = getMatchupDetails(eventTitle);
      
      const timeStr = arg.event.start ? arg.event.start.toLocaleTimeString([], { 
        hour: 'numeric', 
        minute: '2-digit', 
        timeZoneName: 'short' 
      }) : '';

      // CALENDAR VIEW: Displays ONLY the opposing team's logo
      return {
        html: `
          <div class="custom-event-card">
            <div class="logo-circle">
              <img src="${matchup.oppLogo}" alt="${eventTitle}" />
            </div>
            <div class="game-time">${timeStr}</div>   
          </div>
        `
      };
    },
    eventsSet: function(events) {
      renderListView(events);
    }
  });

  calendar.render();
});

// Tab Switcher Function
function switchView(viewName) {
  document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
  document.querySelectorAll('.view-content').forEach(view => view.classList.remove('active'));

  if (viewName === 'calendar') {
    document.querySelector('.tab-btn:nth-child(1)').classList.add('active');
    document.getElementById('calendar-view').classList.add('active');
  } else {
    document.querySelector('.tab-btn:nth-child(2)').classList.add('active');
    document.getElementById('list-view').classList.add('active');
  }
}

// Function to render upcoming games list
function renderListView(events) {
  const container = document.getElementById('upcoming-games-container');
  if (!container) return;

  const now = new Date();

  const upcomingEvents = events.filter(e => e.start && new Date(e.start) > now);

  if (upcomingEvents.length === 0) {
    container.innerHTML = '<p>No upcoming games scheduled.</p>';
    return;
  }

  upcomingEvents.sort((a, b) => new Date(a.start) - new Date(b.start));

  const grouped = {};
  upcomingEvents.forEach(e => {
    const startDate = new Date(e.start);
    const dateStr = startDate.toLocaleDateString([], { 
      weekday: 'long', 
      month: 'long', 
      day: 'numeric', 
      year: 'numeric' 
    });
    
    if (!grouped[dateStr]) grouped[dateStr] = [];
    grouped[dateStr].push(e);
  });

  let html = '';

  for (const date in grouped) {
    html += `
      <div class="date-group">
        <h3 class="date-header">${date}</h3>
        <table class="schedule-table">
          <thead>
            <tr>
              <th style="width: 50%;">Matchup</th>
              <th style="width: 25%;">Time</th>
              <th style="width: 25%;">Location</th>
            </tr>
          </thead>
          <tbody>
    `;

    grouped[date].forEach(event => {
      const startDate = new Date(event.start);
      const timeStr = startDate.toLocaleTimeString([], { 
        hour: 'numeric', 
        minute: '2-digit', 
        timeZoneName: 'short' 
      });
      
      const location = (event.extendedProps && event.extendedProps.location) 
        ? event.extendedProps.location 
        : 'TBD';

      const matchup = getMatchupDetails(event.title);

      // LIST VIEW: Retains the text and positions logos on either side
      html += `
        <tr>
          <td>
            <div class="matchup-cell ${matchup.shouldSwap ? 'swap-sides' : ''}">
              <img src="${matchup.oppLogo}" alt="Opponent Logo" />
              <span>${event.title || 'Game'}</span>
              <img src="${teamLogos.dk}" alt="Dark Knights Logo" />
            </div>
          </td>
          <td>${timeStr}</td>
          <td>${location}</td>
        </tr>
      `;
    });

    html += `
          </tbody>
        </table>
      </div>
    `;
  }

  container.innerHTML = html;
}
</script>
