<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dark Knights Insider</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/site.css">
</head>
<body>

  <div class="masthead">
    <div class="masthead-inner">
      <a class="masthead-brand" href="index.html">
        <img class="masthead-logo" src="assets/images/dark-knights-logo.png" alt="Dark Knights logo">
        <div>
          <div class="masthead-word">Dark Knights <span>Insider</span></div>
          <div class="masthead-sub">Winterhawks Adult Hockey &middot; Bronze Division</div>
        </div>
      </a>
      <nav class="site-nav">
        <a href="index.html" class="active">News</a>
        <a href="https://wicadulthockey.sportngin.com/schedule/team_instance/10525095" target="_blank" rel="noopener">Schedule</a>
        <a href="https://wicadulthockey.sportngin.com/standings/show/9444290" target="_blank" rel="noopener">Standings</a>
      </nav>
    </div>
  </div>

  <div class="page-stage">
    <img class="page-stage-watermark left" src="assets/images/dark-knights-logo.png" alt="">

    <div class="card">
      <figure class="article-figure" style="margin-top:28px;">
        <img src="assets/images/dark-knights-team-photo.jpeg" alt="The Dark Knights pose together in the locker room in their bat-themed jerseys">
        <figcaption>The Dark Knights &middot; Bronze Division, Summer 2026</figcaption>
      </figure>

      <div class="list-heading first">Latest</div>
      <div class="article-list" id="article-list">
        <!-- populated by assets/articles-data.js -->
      </div>

      <footer>
        <div class="foot-logo">
          <img src="assets/images/dark-knights-logo.png" alt="Dark Knights logo">
          <span>Dark Knights Insider</span>
        </div>
        <p>Winterhawks Adult Hockey &middot; Sherwood League &middot; Bronze Division &middot; Summer 2026</p>
      </footer>
    </div>
  </div>

  <script src="assets/articles-data.js"></script>
  <script>
    function formatDate(iso){
      var parts = iso.split('-');
      var d = new Date(Date.UTC(parts[0], parts[1]-1, parts[2]));
      return d.toLocaleDateString('en-US', { month: 'long', day: 'numeric', year: 'numeric', timeZone: 'UTC' });
    }

    var list = document.getElementById('article-list');
    var items = (window.ARTICLES || []).slice().sort(function(a, b){
      return new Date(b.date) - new Date(a.date);
    });

    if (items.length === 0) {
      list.innerHTML = '<div class="empty-state">No articles yet — add one to assets/articles-data.js.</div>';
    } else {
      items.forEach(function(item){
        var tagsHtml = (item.tags || []).map(function(t, i){
          return '<span class="tag' + (i === 0 ? ' accent' : '') + '">' + t + '</span>';
        }).join('');

        var card = document.createElement('a');
        card.className = 'article-card';
        card.href = item.href;
        card.innerHTML =
          '<div class="article-card-tags">' + tagsHtml + '</div>' +
          '<h2 class="article-card-title">' + item.title + '</h2>' +
          '<p class="article-card-dek">' + item.dek + '</p>' +
          '<div class="article-card-date">' + (item.dateLabel || formatDate(item.date)) + '</div>';
        list.appendChild(card);
      });
    }
  </script>

</body>
</html>
