<!-- 1. FullCalendar & iCal Dependencies (Loaded with defer for non-blocking render) -->
<script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.11/index.global.min.js" defer></script>
<script src="https://cdn.jsdelivr.net/npm/ical.js@1.5.0/build/ical.min.js" defer></script>
<script src="https://cdn.jsdelivr.net/npm/@fullcalendar/icalendar@6.1.11/index.global.min.js" defer></script>

<style>
  /* Custom styles for the minimal Stick & Puck look */
  .legend-item {
    cursor: pointer;
    user-select: none;
    display: inline-flex;
    align-items: center;
    margin-right: 15px;
    font-weight: 500;
  }
  .legend-item.disabled {
    opacity: 0.4;
    text-decoration: line-through;
  }
  .legend-item input[type="checkbox"] {
    margin-right: 6px;
    cursor: pointer;
  }
  .legend-dot {
    display: inline-block;
    width: 12px;
    height: 12px;
    border-radius: 50%;
    margin-right: 5px;
  }
  .rink-link {
    font-size: 0.85em;
    margin-left: 5px;
    text-decoration: underline;
    color: #666;
  }
  .session-title {
    font-weight: bold;
  }
  .session-title a {
    color: inherit;
    text-decoration: none;
  }
  .session-title a:hover {
    text-decoration: underline;
  }
  /* Utility class to hide unwanted events from the calendar */
  .hidden-event {
    display: none !important;
  }

  /* --- STRETCH EVENT CARDS TO FILL HEIGHT --- */
  .fc-daygrid-day:has(.fc-event) .fc-daygrid-day-frame {
    height: 100%;
    justify-content: flex-start;
  }
  .fc-daygrid-day .fc-daygrid-day-frame {
    background-color: #ededed;
    border-radius: 12px;
    min-height: 160px;
    padding: 8px;
    display: flex;
    flex-direction: column;
    justify-content: flex-start;
    box-sizing: border-box;
    transition: all 0.15s ease;
  }
  .fc-daygrid-event-harness {
    margin-bottom: 4px !important;
  }
  .fc-daygrid-event {
    background: transparent !important;
    border: none !important;
    padding: 0 !important;
  }
  .custom-event-card {
    height: 100%;
    display: flex;
    flex-direction: column;
    justify-content: center;
    background: #fff;
    box-sizing: border-box;
  }
  
  /* Loading placeholder state */
  .calendar-loading {
    text-align: center;
    padding: 40px;
    color: #666;
    font-style: italic;
  }
</style>

<!-- Navigation Tabs -->
<div class="schedule-tabs">
  <button class="tab-btn active" onclick="switchView('calendar')">Calendar</button>
  <button class="tab-btn" onclick="switchView('list')">List</button>
</div>

<!-- Tab 1: Calendar View -->
<div id="calendar-view" class="view-content active">
  <h2 class="list-section-title">Stick & Puck Calendar</h2>

  <!-- Dynamic Legend / Toggles -->
  <div id="schedule-legend" class="legend"></div>

  <div id="calendar">
    <div class="calendar-loading">Loading schedule data...</div>
  </div>
</div>

<!-- Tab 2: List View -->
<div id="list-view" class="view-content">
  <h2 class="list-section-title">Upcoming Sessions</h2>
  <div id="upcoming-games-container">Loading schedule...</div>
</div>

<script>
// --- CONFIGURATION ---
const calendarsConfig = [
  { 
    id: 'wsc', 
    name: 'Winterhawks Ice Center (Beaverton)', 
    icsUrl: 'https://beaverton-stick-and-puck.xarria.workers.dev/', 
    siteUrl: 'https://winterhawksskatingcenter.com/registration',
    color: '#0072B2', 
    enabled: true 
  },
  { 
    id: 'sherwood', 
    name: 'Sherwood Ice Arena', 
    icsUrl: 'https://sherwood-stick-and-puck.xarria.workers.dev/', 
    siteUrl: 'https://www.winterhawksice.com/sherwood-schedule', 
    color: '#CC79A7', 
    enabled: true 
  },
  { 
    id: 'mv', 
    name: 'Mountain View Ice Arena', 
    icsUrl: 'https://mountainview-stick-and-puck.xarria.workers.dev/', 
    siteUrl: 'https://15560.ezfacility.com/Sessions?reset=True', 
    color: '#E69F00', 
    enabled: true 
  }
];

let calendarInstance = null;

function getRinkConfig(id) {
  return calendarsConfig.find(c => c.id === id) || null;
}

function isRelevantEvent(title) {
  if (!title) return false;
  const t = title.toLowerCase();
  return t.includes('stick') || t.includes('clinic');
}

function getEventUrl(event) {
  if (event.url) return event.url;
  if (event.extendedProps && event.extendedProps.url) return event.extendedProps.url;

  const desc = event.extendedProps ? event.extendedProps.description : '';
  if (desc) {
    const hrefMatch = desc.match(/href=["'](https?:\/\/[^"']+)["']/i);
    if (hrefMatch && hrefMatch[1]) return hrefMatch[1];

    const urlMatch = desc.match(/(https?:\/\/[^\s"<]+)/i);
    if (urlMatch && urlMatch[0]) return urlMatch[0];
  }

  return null;
}

function renderLegend() {
  const legendContainer = document.getElementById('schedule-legend');
  if (!legendContainer) return;

  legendContainer.innerHTML = calendarsConfig.map(c => `
    <label class="legend-item ${c.enabled ? '' : 'disabled'}">
      <input type="checkbox" data-rink-id="${c.id}" ${c.enabled ? 'checked' : ''} onchange="toggleRink('${c.id}')">
      <span class="legend-dot" style="background-color: ${c.color};"></span>
      ${c.name}
      <a href="${c.siteUrl}" class="rink-link" target="_blank" onclick="event.stopPropagation()">(Website)</a>
    </label>
  `).join(' | ');
}

function toggleRink(rinkId) {
  const rink = calendarsConfig.find(c => c.id === rinkId);
  if (!rink) return;

  rink.enabled = !rink.enabled;
  renderLegend();

  if (calendarInstance) {
    const source = calendarInstance.getEventSourceById(rinkId);
    if (rink.enabled) {
      if (!source) {
        calendarInstance.addEventSource({
          id: rink.id,
          url: rink.icsUrl,
          format: 'ics'
        });
      }
    } else {
      if (source) {
        source.remove();
      }
    }
    renderListView(calendarInstance.getEvents());
  }
}

// Initialize asynchronously once DOM and deferred scripts are ready
document.addEventListener('DOMContentLoaded', function() {
  renderLegend();

  // Poll briefly to ensure FullCalendar script has finished defer-loading
  const initInterval = setInterval(() => {
    if (typeof FullCalendar !== 'undefined') {
      clearInterval(initInterval);
      initCalendar();
    }
  }, 50);
});

function initCalendar() {
  const calendarEl = document.getElementById('calendar');

  calendarInstance = new FullCalendar.Calendar(calendarEl, {
    initialView: 'dayGridMonth',
    height: 'auto',
    aspectRatio: 1.35,
    headerToolbar: {
      left: 'title',
      center: '',
      right: 'prev,next today'
    },
    eventSources: calendarsConfig.filter(c => c.enabled).map(function(cfg) {
      return {
        id: cfg.id,
        url: cfg.icsUrl,
        format: 'ics'
      };
    }),
    eventClassNames: function(arg) {
      if (!isRelevantEvent(arg.event.title)) {
        return ['hidden-event'];
      }
      return [];
    },
    eventContent: function(arg) {
      const sourceId = (arg.event.source && arg.event.source.id) ? arg.event.source.id : null;
      const rinkConfig = getRinkConfig(sourceId);
      const eventColor = rinkConfig ? rinkConfig.color : '#333';

      const timeStr = arg.event.start ? arg.event.start.toLocaleTimeString([], {
        hour: 'numeric',
        minute: '2-digit'
      }) : '';
      
      const title = arg.event.title || 'Stick & Puck';
      const eventUrl = getEventUrl(arg.event);

      const titleHtml = eventUrl 
        ? `<a href="${eventUrl}" target="_blank">${title}</a>`
        : title;

      return {
        html: `
          <div class="custom-event-card" style="padding: 4px 6px; border-left: 6px solid ${eventColor};">
            <div class="game-time" style="font-size: 0.85em; font-weight: 600;">${timeStr}</div>
            <div class="session-title" style="font-size: 0.9em; white-space: normal;">${titleHtml}</div>
          </div>
        `
      };
    },
    eventsSet: function(events) {
      renderListView(events);
    }
  });

  calendarInstance.render();
}

function switchView(viewName) {
  document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
  document.querySelectorAll('.view-content').forEach(view => view.classList.remove('active'));

  if (viewName === 'calendar') {
    document.querySelector('.tab-btn:nth-child(1)').classList.add('active');
    document.getElementById('calendar-view').classList.add('active');
  } else {
    document.querySelector('.tab-btn:nth-child(2)').classList.add('active');
    document.getElementById('list-view').classList.add('active');
  }
}

function renderListView(events) {
  const container = document.getElementById('upcoming-games-container');
  if (!container) return;

  const now = new Date();
  
  const upcomingEvents = events.filter(e => {
    if (!e.start || new Date(e.start) <= now) return false;
    if (!isRelevantEvent(e.title)) return false;

    const sourceId = (e.source && e.source.id) ? e.source.id : null;
    const rinkConfig = getRinkConfig(sourceId);
    return rinkConfig ? rinkConfig.enabled : true;
  });

  if (upcomingEvents.length === 0) {
    container.innerHTML = '<p>No upcoming sessions found.</p>';
    return;
  }

  upcomingEvents.sort((a, b) => new Date(a.start) - new Date(b.start));

  const grouped = {};
  upcomingEvents.forEach(e => {
    const startDate = new Date(e.start);
    const dateStr = startDate.toLocaleDateString([], {
      weekday: 'long',
      month: 'long',
      day: 'numeric',
      year: 'numeric'
    });

    if (!grouped[dateStr]) grouped[dateStr] = [];
    grouped[dateStr].push(e);
  });

  let html = '';

  for (const date in grouped) {
    html += `
      <div class="date-group">
        <h3 class="date-header">${date}</h3>
        <table class="schedule-table">
          <thead>
            <tr>
              <th style="width: 30%;">Time</th>
              <th style="width: 35%;">Session</th>
              <th style="width: 35%;">Location</th>
            </tr>
          </thead>
          <tbody>
    `;

    grouped[date].forEach(event => {
      const startDate = new Date(event.start);
      const timeStr = startDate.toLocaleTimeString([], {
        hour: 'numeric',
        minute: '2-digit',
        timeZoneName: 'short'
      });

      const sourceId = (event.source && event.source.id) ? event.source.id : null;
      const rinkConfig = getRinkConfig(sourceId);

      let location = 'TBD';
      let eventColor = '#333';

      if (rinkConfig) {
        location = rinkConfig.name;
        eventColor = rinkConfig.color;
      } else if (event.extendedProps && event.extendedProps.location) {
        location = event.extendedProps.location;
      }

      const targetUrl = getEventUrl(event);

      html += `
        <tr>
          <td style="font-weight: bold;">
            <span class="legend-dot" style="background-color: ${eventColor};"></span>
            ${timeStr}
          </td>
          <td>${event.title || 'Stick & Puck'}</td>
          <td>
            ${location} 
            ${targetUrl ? `<br><a href="${targetUrl}" target="_blank" style="font-size: 0.85em; color: #0066cc;">Register / Info</a>` : ''}
          </td>
        </tr>
      `;
    });

    html += `
          </tbody>
        </table>
      </div>
    `;
  }

  container.innerHTML = html;
}
</script>
