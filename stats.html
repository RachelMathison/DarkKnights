---
layout: default
title: Team Statistics
---

<div class="stats-container">
  <h2 class="list-section-title">Statistics</h2>

  <div class="stats-table-wrapper">
    <table class="stats-table" id="skaters-table">
      <thead>
        <tr>
          <th data-key="number" onclick="sortTable('number')"># <span class="sort-icon"></span></th>
          <th data-key="name" onclick="sortTable('name')">Player <span class="sort-icon"></span></th>
          <th data-key="gp" onclick="sortTable('gp')">GP <span class="sort-icon"></span></th>
          <th data-key="g" onclick="sortTable('g')">G <span class="sort-icon"></span></th>
          <th data-key="a" onclick="sortTable('a')">A <span class="sort-icon"></span></th>
          <th data-key="pts" onclick="sortTable('pts')">PTS <span class="sort-icon"></span></th>
          <th data-key="avgPts" onclick="sortTable('avgPts')">PTS/G <span class="sort-icon"></span></th>
          <th data-key="pim" onclick="sortTable('pim')">PIM <span class="sort-icon"></span></th>
          <th data-key="ppg" onclick="sortTable('ppg')">PPG <span class="sort-icon"></span></th>
          <th data-key="gw" onclick="sortTable('gw')">GWG <span class="sort-icon"></span></th>
        </tr>
      </thead>
      <tbody id="stats-tbody">
        <tr><td colspan="10" style="text-align: center; color: var(--gray-500);">Loading player statistics...</td></tr>
      </tbody>
    </table>
  </div>
</div>

<script>
  let skaterStats = [];
  let currentSort = { key: 'pts', ascending: false };

  // Map sort keys to their respective column index (0-based)
  const columnKeys = ['number', 'name', 'gp', 'g', 'a', 'pts', 'avgPts', 'pim', 'ppg', 'gw'];

  async function fetchStats() {
    try {
      const response = await fetch('https://knights-stats.xarria.workers.dev');
      const data = await response.json();
      skaterStats = data.skaters;
      
      sortData(currentSort.key, currentSort.ascending);
    } catch (error) {
      document.getElementById('stats-tbody').innerHTML = `<tr><td colspan="10" style="text-align: center; color: red;">Failed to load stats.</td></tr>`;
      console.error('Error fetching stats:', error);
    }
  }

  function sortTable(key) {
    if (currentSort.key === key) {
      currentSort.ascending = !currentSort.ascending;
    } else {
      currentSort.key = key;
      currentSort.ascending = (key === 'name' || key === 'number');
    }
    sortData(currentSort.key, currentSort.ascending);
  }

  function sortData(key, ascending) {
    skaterStats.sort((a, b) => {
      let valA = a[key];
      let valB = b[key];

      if (typeof valA === 'string') {
        valA = valA.toLowerCase();
        valB = valB.toLowerCase();
      }

      if (valA < valB) return ascending ? -1 : 1;
      if (valA > valB) return ascending ? 1 : -1;
      return 0;
    });

    updateTableUI();
  }

  function updateTableUI() {
    const activeIndex = columnKeys.indexOf(currentSort.key);

    // 1. Update Header Classes and Icons
    document.querySelectorAll('#skaters-table th').forEach((th, index) => {
      const icon = th.querySelector('.sort-icon');
      icon.textContent = '';
      
      if (index === activeIndex) {
        th.classList.add('active-sort-col');
        icon.textContent = currentSort.ascending ? '▲' : '▼';
      } else {
        th.classList.remove('active-sort-col');
      }
    });

    // 2. Render Body and Highlight Active Column Cells
    const tbody = document.getElementById('stats-tbody');
    
    if (skaterStats.length === 0) {
      tbody.innerHTML = `<tr><td colspan="10" style="text-align: center;">No skater stats found.</td></tr>`;
      return;
    }

    tbody.innerHTML = skaterStats.map(player => {
      return `
        <tr>
          <td ${activeIndex === 0 ? 'class="active-sort-col"' : ''}><strong>${player.number}</strong></td>
          <td ${activeIndex === 1 ? 'class="active-sort-col"' : ''}>
            <div class="player-cell">
              <a href="${player.profileUrl}" class="player-name" target="_blank" rel="noopener noreferrer">${player.name}</a>
            </div>
          </td>
          <td ${activeIndex === 2 ? 'class="active-sort-col"' : ''}>${player.gp}</td>
          <td ${activeIndex === 3 ? 'class="active-sort-col"' : ''}>${player.g}</td>
          <td ${activeIndex === 4 ? 'class="active-sort-col"' : ''}>${player.a}</td>
          <td ${activeIndex === 5 ? 'class="active-sort-col"' : ''}><strong>${player.pts}</strong></td>
          <td ${activeIndex === 6 ? 'class="active-sort-col"' : ''}>${player.avgPts.toFixed(2)}</td>
          <td ${activeIndex === 7 ? 'class="active-sort-col"' : ''}>${player.pim}</td>
          <td ${activeIndex === 8 ? 'class="active-sort-col"' : ''}>${player.ppg}</td>
          <td ${activeIndex === 9 ? 'class="active-sort-col"' : ''}>${player.gw}</td>
        </tr>
      `;
    }).join('');
  }

  fetchStats();
</script>
